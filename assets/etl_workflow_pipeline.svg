    <polygon points="1117,256 1125,260 1117,264" fill="#FBBF24"/>
    <polygon points="1117,386 1125,390 1117,394" fill="#FBBF24"/>
    <polygon points="1117,516 1125,520 1117,524" fill="#FBBF24"/>
