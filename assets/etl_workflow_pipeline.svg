<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#1E2640"/>
    </linearGradient>

    <!-- Node Color Gradients -->
    <linearGradient id="seqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="branch1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>

    <linearGradient id="branch2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>

    <linearGradient id="goldNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Line Gradients -->
    <linearGradient id="flowLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="640" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Pattern in background -->
  <g opacity="0.04">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350 M 0,400 L 1200,400 M 0,450 L 1200,450 M 0,500 L 1200,500 M 0,550 L 1200,550 M 0,600 L 1200,600" stroke="#38BDF8" stroke-width="1"/>
    <path d="M 100,0 L 100,640 M 200,0 L 200,640 M 300,0 L 300,640 M 400,0 L 400,640 M 500,0 L 500,640 M 600,0 L 600,640 M 700,0 L 700,640 M 800,0 L 800,640 M 900,0 L 900,640 M 1000,0 L 1000,640 M 1100,0 L 1100,640" stroke="#38BDF8" stroke-width="1"/>
  </g>

  <!-- Title & Description -->
  <text x="50" y="45" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="0.5">ORQUESTRAÇÃO DO PIPELINE - DAG DE TAREFAS (DATABRICKS JOBS)</text>
  <text x="50" y="68" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500">Fluxo direcionado acíclico (DAG) que garante dependência lógica e paralelismo na execução das etapas</text>

  <!-- Legend and Metadata -->
  <g transform="translate(820, 30)">
    <rect width="330" height="40" rx="6" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
    
    <circle cx="20" cy="20" r="5" fill="#38BDF8"/>
    <text x="30" y="23" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="10.5" font-weight="600">Seqüencial</text>

    <circle cx="105" cy="20" r="5" fill="#2DD4BF"/>
    <text x="115" y="23" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="10.5" font-weight="600">Dimensões (Paralelo)</text>

