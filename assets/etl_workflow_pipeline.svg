  <g stroke="#38BDF8" stroke-opacity="0.3" stroke-width="2.5" fill="none">
    <!-- Sequential Flow Line (Col 1 to 4) -->
    <path d="M 125,325 L 175,325"/>
    <path d="M 285,325 L 335,325"/>
    <path d="M 445,325 L 495,325"/>
    
    <!-- Col 4 to Col 5 (Branching 1: sequential to 4 parallel dimensions) -->
    <path d="M 605,325 L 635,325 L 635,130 L 665,130"/>
    <path d="M 605,325 L 635,325 L 635,260 L 665,260"/>
    <path d="M 605,325 L 635,325 L 635,390 L 665,390"/>
    <path d="M 605,325 L 635,325 L 635,520 L 665,520"/>

    <!-- Col 5 to Col 6 (Merging 1: 4 parallel dimensions to Set_PKs) -->
    <path d="M 775,130 L 805,130 L 805,325 L 835,325"/>
    <path d="M 775,260 L 805,260 L 805,325 L 835,325"/>
    <path d="M 775,390 L 805,390 L 805,325 L 835,325"/>
    <path d="M 775,520 L 805,520 L 805,325 L 835,325"/>

    <!-- Col 6 to Col 7 (Set_PKs to Fact Table) -->
    <path d="M 945,325 L 980,325"/>

    <!-- Col 7 to Col 8 (Branching 2: Fact table to Gold analytical jobs) -->
    <path d="M 1090,325 L 1110,325 L 1110,130 L 1125,130"/>
    <path d="M 1090,325 L 1110,325 L 1110,260 L 1125,260"/>
    <path d="M 1090,325 L 1110,325 L 1110,390 L 1125,390"/>
    <path d="M 1090,325 L 1110,325 L 1110,520 L 1125,520"/>
  </g>

  <!-- Arrowheads on curves -->
  <g fill="#38BDF8" opacity="0.8">
    <!-- Col 1 to 4 sequential arrows -->
    <polygon points="175,321 183,325 175,329"/>
    <polygon points="335,321 343,325 335,329"/>
    <polygon points="495,321 503,325 495,329"/>

    <!-- Col 4 to 5 dimension arrows -->
    <polygon points="657,126 665,130 657,134" fill="#2DD4BF"/>
    <polygon points="657,256 665,260 657,264" fill="#2DD4BF"/>
    <polygon points="657,386 665,390 657,394" fill="#2DD4BF"/>
    <polygon points="657,516 665,520 657,524" fill="#2DD4BF"/>

