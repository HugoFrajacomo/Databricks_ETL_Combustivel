<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#1E2640"/>
    </linearGradient>

    <!-- Fact Table Gradient (Blue) -->
    <linearGradient id="factGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Dimension Table Gradient (Teal/Green) -->
    <linearGradient id="dimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Key Gradients -->
    <linearGradient id="pkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="fkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <!-- Star Schema Glow -->
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="620" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Pattern in background -->
  <g opacity="0.04">
    <path d="M 0,50 L 1100,50 M 0,100 L 1100,100 M 0,150 L 1100,150 M 0,200 L 1100,200 M 0,250 L 1100,250 M 0,300 L 1100,300 M 0,350 L 1100,350 M 0,400 L 1100,400 M 0,450 L 1100,450 M 0,500 L 1100,500 M 0,550 L 1100,550" stroke="#38BDF8" stroke-width="1"/>
    <path d="M 100,0 L 100,620 M 200,0 L 200,620 M 300,0 L 300,620 M 400,0 L 400,620 M 500,0 L 500,620 M 600,0 L 600,620 M 700,0 L 700,620 M 800,0 L 800,620 M 900,0 L 900,620 M 1000,0 L 1000,620" stroke="#38BDF8" stroke-width="1"/>
  </g>

  <!-- Title & Description -->
  <text x="50" y="50" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="0.5">MODELO DIMENSIONAL - STAR SCHEMA (SILVER LAYER)</text>
  <text x="50" y="75" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="500">Mapeamento de Fatos e Dimensões implementado no Unity Catalog com restrições PK/FK</text>

  <!-- Legend -->
  <g transform="translate(800, 35)">
    <!-- PK Legend -->
    <rect x="0" y="0" width="14" height="14" rx="3" fill="url(#pkGrad)"/>
    <text x="7" y="10" fill="#0F172A" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="900" text-anchor="middle">K</text>
    <text x="22" y="11" fill="#E2E8F0" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600">Chave Primária (PK)</text>

    <!-- FK Legend -->
    <rect x="135" y="0" width="14" height="14" rx="3" fill="url(#fkGrad)"/>
    <text x="142" y="10" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="900" text-anchor="middle">K</text>
    <text x="157" y="11" fill="#E2E8F0" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600">Chave Estrangeira (FK)</text>
  </g>

  <!-- ==================== RELATIONSHIP LINES (CONNECTIONS) ==================== -->
  <g stroke="#38BDF8" stroke-opacity="0.3" stroke-width="2" fill="none">
    <!-- dim_revenda (Top-Left) to fact_fuel -->
    <path d="M 280,240 L 380,240 L 380,285 L 430,285"/>
    
    <!-- dim_localidade (Bottom-Left) to fact_fuel -->
    <path d="M 280,430 L 380,430 L 380,315 L 430,315"/>

    <!-- dim_produto (Top-Right) to fact_fuel -->
    <path d="M 820,240 L 720,240 L 720,300 L 670,300"/>

    <!-- dim_tempo (Bottom-Right) to fact_fuel -->
    <path d="M 820,430 L 720,430 L 720,330 L 670,330"/>
  </g>

  <!-- Interactive/Highlight connection dots -->
  <g fill="#38BDF8" filter="url(#starGlow)">
    <circle cx="430" cy="285" r="4"/>
    <circle cx="430" cy="315" r="4"/>
    <circle cx="670" cy="300" r="4"/>
    <circle cx="670" cy="330" r="4"/>

    <circle cx="280" cy="240" r="4" fill="#FDE047"/>
    <circle cx="280" cy="430" r="4" fill="#FDE047"/>
    <circle cx="820" cy="240" r="4" fill="#FDE047"/>
    <circle cx="820" cy="430" r="4" fill="#FDE047"/>
  </g>

  <!-- ==================== CENTRAL: TABELA FATO (fact_fuel) ==================== -->
  <g transform="translate(430, 210)" filter="url(#shadow)">
    <rect width="240" height="200" rx="12" fill="url(#cardGrad)" stroke="#0284C7" stroke-width="2"/>
    <!-- Header -->
    <rect width="240" height="45" rx="12" fill="url(#factGrad)" stroke-width="0"/>
    <rect x="0" y="33" width="240" height="12" fill="url(#factGrad)" stroke-width="0"/>
    <text x="120" y="27" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="0.5">fact_fuel [FATO]</text>
    
    <!-- Table columns -->
    <g transform="translate(0, 50)">
      <!-- CNPJRevenda -->
      <g transform="translate(0, 10)">
        <rect x="15" y="0" width="14" height="14" rx="3" fill="url(#fkGrad)"/>
        <text x="22" y="10" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="900" text-anchor="middle">FK</text>
        <text x="38" y="11" fill="#F1F5F9" font-family="monospace" font-size="11" font-weight="700">CNPJRevenda</text>
        <text x="225" y="11" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="end">STRING</text>
      </g>

      <!-- Cep -->
      <g transform="translate(0, 32)">
        <rect x="15" y="0" width="14" height="14" rx="3" fill="url(#fkGrad)"/>
        <text x="22" y="10" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="900" text-anchor="middle">FK</text>
        <text x="38" y="11" fill="#F1F5F9" font-family="monospace" font-size="11" font-weight="700">Cep</text>
        <text x="225" y="11" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="end">STRING</text>
      </g>

      <!-- Produto -->
      <g transform="translate(0, 54)">
        <rect x="15" y="0" width="14" height="14" rx="3" fill="url(#fkGrad)"/>
        <text x="22" y="10" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="900" text-anchor="middle">FK</text>
        <text x="38" y="11" fill="#F1F5F9" font-family="monospace" font-size="11" font-weight="700">Produto</text>
        <text x="225" y="11" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="end">STRING</text>
      </g>

      <!-- DataColeta -->
      <g transform="translate(0, 76)">
        <rect x="15" y="0" width="14" height="14" rx="3" fill="url(#fkGrad)"/>
        <text x="22" y="10" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="900" text-anchor="middle">FK</text>
        <text x="38" y="11" fill="#F1F5F9" font-family="monospace" font-size="11" font-weight="700">DataColeta</text>
        <text x="225" y="11" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="end">DATE</text>
      </g>

      <!-- Divider line -->
      <line x1="15" y1="100" x2="225" y2="100" stroke="#334155" stroke-width="1"/>

      <!-- ValorVenda -->
      <g transform="translate(0, 108)">
        <text x="38" y="11" fill="#E2E8F0" font-family="monospace" font-size="11">ValorVenda</text>
        <text x="225" y="11" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="end">DOUBLE</text>
      </g>

      <!-- ValorCompra -->
      <g transform="translate(0, 126)">
        <text x="38" y="11" fill="#E2E8F0" font-family="monospace" font-size="11">ValorCompra</text>
        <text x="225" y="11" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="end">DOUBLE</text>
      </g>
    </g>
  </g>

  <!-- ==================== TOP-LEFT: DIMENSÃO REVENDA ==================== -->
  <g transform="translate(40, 125)" filter="url(#shadow)">
    <rect width="240" height="210" rx="12" fill="url(#cardGrad)" stroke="#0D9488" stroke-width="1.5"/>
    <rect width="240" height="40" rx="12" fill="url(#dimGrad)" stroke-width="0"/>
    <rect x="0" y="28" width="240" height="12" fill="url(#dimGrad)" stroke-width="0"/>
    <text x="120" y="25" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">dim_revenda [DIMENSÃO]</text>
    
    <g transform="translate(0, 45)">
      <!-- CNPJRevenda (PK) -->
      <g transform="translate(0, 10)">
        <rect x="15" y="0" width="14" height="14" rx="3" fill="url(#pkGrad)"/>
        <text x="22" y="10" fill="#0F172A" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="900" text-anchor="middle">PK</text>
        <text x="38" y="11" fill="#F1F5F9" font-family="monospace" font-size="11" font-weight="700">CNPJRevenda</text>
        <text x="225" y="11" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="end">STRING</text>
      </g>

      <!-- Other cols -->
      <g transform="translate(0, 30)">
        <text x="38" y="11" fill="#E2E8F0" font-family="monospace" font-size="11">Revenda</text>
        <text x="225" y="11" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="end">STRING</text>
      </g>
      <g transform="translate(0, 48)">
        <text x="38" y="11" fill="#E2E8F0" font-family="monospace" font-size="11">NomeRua</text>
        <text x="225" y="11" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="end">STRING</text>
      </g>
      <g transform="translate(0, 66)">
        <text x="38" y="11" fill="#E2E8F0" font-family="monospace" font-size="11">NumeroRua</text>
        <text x="225" y="11" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="end">STRING</text>
      </g>
      <g transform="translate(0, 84)">
        <text x="38" y="11" fill="#E2E8F0" font-family="monospace" font-size="11">Complemento</text>
        <text x="225" y="11" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="end">STRING</text>
      </g>
      <g transform="translate(0, 102)">
        <text x="38" y="11" fill="#E2E8F0" font-family="monospace" font-size="11">Bandeira</text>
        <text x="225" y="11" fill="#2DD4BF" font-family="monospace" font-size="10" text-anchor="end">STRING</text>
      </g>
      <g transform="translate(0, 120)">
        <text x="38" y="11" fill="#E2E8F0" font-family="monospace" font-size="11">cep</text>
        <text x="225" y="11" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="end">STRING</text>
      </g>
    </g>
  </g>

  <!-- ==================== BOTTOM-LEFT: DIMENSÃO LOCALIDADE ==================== -->
  <g transform="translate(40, 360)" filter="url(#shadow)">
    <rect width="240" height="150" rx="12" fill="url(#cardGrad)" stroke="#0D9488" stroke-width="1.5"/>
    <rect width="240" height="40" rx="12" fill="url(#dimGrad)" stroke-width="0"/>
    <rect x="0" y="28" width="240" height="12" fill="url(#dimGrad)" stroke-width="0"/>
    <text x="120" y="25" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">dim_localidade [DIMENSÃO]</text>
    
    <g transform="translate(0, 45)">
      <!-- Cep (PK) -->
      <g transform="translate(0, 10)">
        <rect x="15" y="0" width="14" height="14" rx="3" fill="url(#pkGrad)"/>
        <text x="22" y="10" fill="#0F172A" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="900" text-anchor="middle">PK</text>
        <text x="38" y="11" fill="#F1F5F9" font-family="monospace" font-size="11" font-weight="700">Cep</text>
        <text x="225" y="11" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="end">STRING</text>
      </g>

      <!-- Other cols -->
      <g transform="translate(0, 30)">
        <text x="38" y="11" fill="#E2E8F0" font-family="monospace" font-size="11">RegiaoSigla</text>
        <text x="225" y="11" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="end">STRING</text>
      </g>
      <g transform="translate(0, 48)">
        <text x="38" y="11" fill="#E2E8F0" font-family="monospace" font-size="11">EstadoSigla</text>
        <text x="225" y="11" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="end">STRING</text>
      </g>
      <g transform="translate(0, 66)">
        <text x="38" y="11" fill="#E2E8F0" font-family="monospace" font-size="11">Municipio</text>
        <text x="225" y="11" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="end">STRING</text>
      </g>
    </g>
  </g>

  <!-- ==================== TOP-RIGHT: DIMENSÃO PRODUTO ==================== -->
  <g transform="translate(820, 150)" filter="url(#shadow)">
    <rect width="240" height="110" rx="12" fill="url(#cardGrad)" stroke="#0D9488" stroke-width="1.5"/>
    <rect width="240" height="40" rx="12" fill="url(#dimGrad)" stroke-width="0"/>
    <rect x="0" y="28" width="240" height="12" fill="url(#dimGrad)" stroke-width="0"/>
    <text x="120" y="25" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">dim_produto [DIMENSÃO]</text>
    
    <g transform="translate(0, 45)">
      <!-- Produto (PK) -->
      <g transform="translate(0, 10)">
        <rect x="15" y="0" width="14" height="14" rx="3" fill="url(#pkGrad)"/>
        <text x="22" y="10" fill="#0F172A" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="900" text-anchor="middle">PK</text>
        <text x="38" y="11" fill="#F1F5F9" font-family="monospace" font-size="11" font-weight="700">Produto</text>
        <text x="225" y="11" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="end">STRING</text>
      </g>

      <!-- UnidadeMedida -->
      <g transform="translate(0, 32)">
        <text x="38" y="11" fill="#E2E8F0" font-family="monospace" font-size="11">UnidadeMedida</text>
        <text x="225" y="11" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="end">STRING</text>
      </g>
    </g>
  </g>

  <!-- ==================== BOTTOM-RIGHT: DIMENSÃO TEMPO ==================== -->
  <g transform="translate(820, 290)" filter="url(#shadow)">
    <rect width="240" height="220" rx="12" fill="url(#cardGrad)" stroke="#0D9488" stroke-width="1.5"/>
    <rect width="240" height="40" rx="12" fill="url(#dimGrad)" stroke-width="0"/>
    <rect x="0" y="28" width="240" height="12" fill="url(#dimGrad)" stroke-width="0"/>
    <text x="120" y="25" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">dim_tempo [DIMENSÃO]</text>
    
    <g transform="translate(0, 45)">
      <!-- DataColeta (PK) -->
      <g transform="translate(0, 10)">
        <rect x="15" y="0" width="14" height="14" rx="3" fill="url(#pkGrad)"/>
        <text x="22" y="10" fill="#0F172A" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="900" text-anchor="middle">PK</text>
        <text x="38" y="11" fill="#F1F5F9" font-family="monospace" font-size="11" font-weight="700">DataColeta</text>
        <text x="225" y="11" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="end">DATE</text>
      </g>

      <!-- Other cols -->
      <g transform="translate(0, 30)">
        <text x="38" y="11" fill="#E2E8F0" font-family="monospace" font-size="11">dia</text>
        <text x="225" y="11" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="end">INTEGER</text>
      </g>
      <g transform="translate(0, 48)">
        <text x="38" y="11" fill="#E2E8F0" font-family="monospace" font-size="11">mes</text>
        <text x="225" y="11" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="end">INTEGER</text>
      </g>
      <g transform="translate(0, 66)">
        <text x="38" y="11" fill="#E2E8F0" font-family="monospace" font-size="11">ano</text>
        <text x="225" y="11" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="end">INTEGER</text>
      </g>
      <g transform="translate(0, 84)">
        <text x="38" y="11" fill="#E2E8F0" font-family="monospace" font-size="11">semana</text>
        <text x="225" y="11" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="end">INTEGER</text>
      </g>
      <g transform="translate(0, 102)">
        <text x="38" y="11" fill="#E2E8F0" font-family="monospace" font-size="11">trimestre</text>
        <text x="225" y="11" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="end">INTEGER</text>
      </g>
    </g>
  </g>

  <!-- ==================== BOTTOM FOOTER INFO ==================== -->
  <g transform="translate(40, 540)">
    <rect width="1020" height="50" rx="10" fill="#1E293B" fill-opacity="0.5" stroke="#334155" stroke-width="1"/>
    <text x="30" y="30" fill="#0D9488" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700">INTEGRIDADE REFERENCIAL</text>
    <text x="210" y="30" fill="#E2E8F0" font-family="'Inter', system-ui, sans-serif" font-size="11">Unity Catalog impõe e garante restrições de chaves para compatibilidade com ferramentas de BI, otimizando caminhos de join.</text>
  </g>
</svg>
